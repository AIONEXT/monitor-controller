name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '22'
  CERT_FILE: ./certs/certificate.pfx

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Import Code Signing Certificate
        if: env.CERT_BASE64 != ''
        run: |
          echo "${{ secrets.CERT_BASE64 }}" | base64 -d > certs/certificate.pfx
        shell: bash
        working-directory: .

      - name: Build Windows Installer
        run: npm run make
        env:
          CERT_FILE: ${{ env.CERT_FILE }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          CERT_HASH_ALGO: sha256
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        working-directory: .

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/zip/win32/x64/*.zip
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build macOS App
        run: npm run make
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        working-directory: .

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            out/make/zip/darwin/*/*.zip
            out/make/zip/darwin/*/*.dmg
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils rpm dpkg ruby ruby-dev build-essential
          sudo apt-get install -y dpkg-dev rpm-build || true
          gem install fpm --user-install --no-document || sudo gem install fpm --no-document
          echo "${HOME}/.local/share/gem/bin" >> "${GITHUB_PATH}"
          echo "/var/lib/gems/*/bin" >> "${GITHUB_PATH}"
          echo "/usr/local/bin" >> "${GITHUB_PATH}"

      - name: Verify fpm
        run: |
          echo "Checking fpm availability..."
          which fpm || find / -name fpm -type f -path '*/bin/*' 2>/dev/null | head -5 || true
          fpm --version || true

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build Linux Packages
        run: npm run make
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        working-directory: .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            out/make/deb/x64/*.deb
            out/make/rpm/x64/*.rpm
            out/make/zip/linux/x64/*.zip
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: artifacts/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Monitor Controller ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/windows/*.exe
            artifacts/windows/*.zip
            artifacts/macos/*.zip
            artifacts/macos/*.dmg
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
            artifacts/linux/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run linting
        run: npm run lint
        working-directory: .

      - name: Run type checking
        run: npm run typecheck
        working-directory: .