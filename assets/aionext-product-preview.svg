    <text x="110" y="205" fill="#f5f7fb" font-size="56" font-weight="750">Every display.</text>
    <text x="110" y="270" fill="#f5f7fb" font-size="56" font-weight="750">One control room.</text>
    <text x="112" y="322" fill="#aeb7ca" font-size="19">Discover displays. Adjust what’s supported. Save the setup you love.</text>
    <rect x="110" y="365" width="196" height="52" rx="13" fill="url(#accent)"/>
    <text x="208" y="398" fill="#081310" font-size="15" font-weight="700" text-anchor="middle">Explore the app</text>
    <text x="328" y="398" fill="#d5dbea" font-size="14">Windows · macOS · Linux</text>

