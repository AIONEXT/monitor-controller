      <rect width="1220" height="350" rx="20" fill="#10141f" stroke="#343b4e"/>
      <path d="M20 0h1180a20 20 0 0 1 20 20v35H0V20A20 20 0 0 1 20 0z" fill="#191e2c"/>
      <circle cx="26" cy="27" r="5" fill="#ff6d73"/><circle cx="45" cy="27" r="5" fill="#f6c75c"/><circle cx="64" cy="27" r="5" fill="#59d6a5"/>
      <text x="92" y="32" fill="#eff2f8" font-size="13" font-weight="700">AIONEXT Monitor Controller</text>
