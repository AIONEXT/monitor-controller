<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AIONEXT Monitor Controller product preview</title>
  <desc id="desc">Premium dark desktop app preview showing two detected displays, viewing presets, compatibility coverage, and brightness and contrast controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0c14"/><stop offset="1" stop-color="#171a2a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#46e6bd"/><stop offset="1" stop-color="#77a7ff"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1d2232"/><stop offset="1" stop-color="#151a27"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".36"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1200" cy="110" r="250" fill="#43dfbc" opacity=".055"/>
  <circle cx="200" cy="790" r="300" fill="#718dff" opacity=".045"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
