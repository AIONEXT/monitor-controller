    <text x="110" y="867" fill="#8792a6" font-size="11">AIONEXT · DISPLAY CONTROL, MADE CLEAR.</text>
    <text x="1330" y="867" fill="#8792a6" font-size="11" text-anchor="end">PRODUCT CONCEPT PREVIEW</text>
